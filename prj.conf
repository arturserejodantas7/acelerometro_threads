# Atividade Acelerometro - Serial com threads (FRDM-KL25Z)
CONFIG_I2C=y
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# printk com %f (o KL25Z nao tem FPU: float por software)
CONFIG_CBPRINTF_FP_SUPPORT=y

# Escalonamento: preemptivo por prioridade fixa (padrao do Zephyr)
CONFIG_NUM_PREEMPT_PRIORITIES=15
CONFIG_TIMESLICING=n
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_TIMEOUT_64BIT=y

CONFIG_THREAD_NAME=y
CONFIG_MAIN_STACK_SIZE=1024
